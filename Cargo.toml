[package]
name = "nml2"
version = "0.1.0"
edition = "2024"

# override executable name with nmlc
[[bin]]
name = "nmlc"
path = "src/main.rs"

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
lalrpop-util = "0.23.2"
nmllib = {path = "nmllib"}

[workspace]
resolver = "3"
members = ["grf","nmllib"]
